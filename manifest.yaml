description: "民间偏方秘方速查。用户描述身体不适（咳嗽、胃痛、便秘、腹泻、失眠、腰痛、痛经、小儿积食、皮肤瘙痒、跌打损伤等），想看看老书里有什么偏方、怎么用、要不要去医院时使用。输出原书方剂（方名、原料、制用法、原书所述效用）、三步用法整理、采购清单与绿/黄/红三级安全边界；急症词出现时只拦截不建议。支持建立本地个人用药档案（慢性病、长期服药、过敏、孕期），之后每轮回答自动过一遍药材×药物相互作用闸门，冲突的方自动跳过并说明原因。原书 232 个病症全部可由口语说法命中，找不到对应病症时明确说「没找到」并给出候选方向，不硬凑一个方子。每道方附原书记载完整度分层，记载最全的方优先呈现。查询涉及儿童时明确警示成人剂量不能套给儿童并指引儿科小节；原料含易混药材时提示抓药辨识要点。也支持按原书页码、方剂编号做来源追溯。默认不展示代码、记录 ID、审核字段或整页扫描图。"
